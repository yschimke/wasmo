# Builds the Homelab Wasmo image from this fork's `deploy` branch and publishes it to this repo's
# GitHub Container Registry, so a deployment can pull a prebuilt image carrying the fork's patches
# (WASMO_BASE_URL, the .wasm content type) instead of building from source.
#
# Images (lowercased owner):
#   ghcr.io/<owner>/wasmo-homelab-foundation  — the JDK + PostgreSQL base (buildx, multi-arch)
#   ghcr.io/<owner>/wasmo-homelab             — the OS image Jib builds on the foundation
#
# Nothing here is specific to any one deployment; the public base URL, secrets and the DNS name are
# all supplied at run time by whoever deploys the image.
name: Publish homelab image

on:
  push:
    branches: [deploy]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Target platforms"
        default: "linux/amd64,linux/arm64"
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-homelab
  cancel-in-progress: true

jobs:
  publish:
    # Skip the auto-run that follows a failed (conflicted) sync.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
    steps:
      - name: Checkout deploy
        uses: actions/checkout@v4
        with:
          ref: deploy

      - name: Lowercase the owner for GHCR
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25, not 21: the build's brevity gradle plugin requires a JVM >= 25 to configure
          # :platform:api, and the foundation image is temurin-25 too.
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the foundation image
        uses: docker/build-push-action@v6
        with:
          context: os/distributions/homelab/src/main/foundation
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/wasmo-homelab-foundation:latest

      - name: Build and push the homelab image (Jib)
        run: |
          ./gradlew :os:distributions:homelab:jib \
            -Djib.from.image=ghcr.io/${{ steps.owner.outputs.name }}/wasmo-homelab-foundation \
            -Djib.from.platforms=${{ env.PLATFORMS }} \
            -Djib.to.image=ghcr.io/${{ steps.owner.outputs.name }}/wasmo-homelab \
            -Djib.to.tags=latest
